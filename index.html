<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
<title>Meeting Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1d1f; --soft: #5d6066; --faint: #8d9096;
  --line: #e3e1dc; --hover: #efede8; --accent: #2a63d4; --accent-ink: #ffffff;
  --rec: #d93a3a; --ok: #2f8a4d; --warn: #b5730d; --mine: #1c1d1f; --theirs: #7b7f86;
  --sel: #e7eefc; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 24px rgba(0,0,0,.06);
  --radius: 12px; --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151618; --panel: #1e1f22; --ink: #ececee; --soft: #b0b3b9; --faint: #80838a;
    --line: #2e3034; --hover: #26282b; --accent: #6d9bf2; --accent-ink: #0d1424;
    --rec: #f06464; --ok: #5cc27e; --warn: #e2a64a; --mine: #f2f2f4; --theirs: #9599a0;
    --sel: #233150; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; padding-top: env(safe-area-inset-top); }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; }
.side-head h1 { font-size: 17px; margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--soft); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.search { margin: 0 14px 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 16px; }
.list { overflow-y: auto; flex: 1; padding: 4px 8px 16px; }
.day { font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 12px 8px 4px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; }
.item:hover { background: var(--hover); }
.item.on { background: var(--sel); }
.item b { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { color: var(--faint); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.rec { background: var(--rec); }
.dot.wait { background: var(--warn); }
.dot.ok { background: var(--ok); }
.side-foot { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.empty { margin: auto; text-align: center; color: var(--soft); padding: 24px; max-width: 420px; }
.empty h2 { color: var(--ink); font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; font-weight: 550; min-height: 40px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .5; cursor: default; }
kbd { font: 12px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: 6px; }

.top { padding: 14px 22px 10px; border-bottom: 1px solid var(--line); }
.title { width: 100%; border: 0; background: transparent; font-size: 26px; font-weight: 650; letter-spacing: -.02em; padding: 0; outline: none; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.meta select, .meta input { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 10px; font-size: 16px; min-height: 38px; }
.meta input { min-width: 0; flex: 1 1 120px; }
.rec-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 600; min-height: 40px; margin-left: auto; }
.rec-btn .ring { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rec) 22%, transparent); }
.rec-btn.on { border-color: var(--rec); color: var(--rec); }
.rec-btn.on .ring { border-radius: 3px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--rec) 12%, transparent); } }
@media (prefers-reduced-motion: reduce) { .rec-btn.on .ring { animation: none; } }
.meter { width: 44px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .1s linear; }
.status { font-size: 13px; color: var(--faint); margin-top: 6px; min-height: 19px; }
.status .warn { color: var(--warn); }

.body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 42%); min-height: 0; }
.pad-wrap { display: flex; flex-direction: column; min-height: 0; }
.pad { flex: 1; border: 0; resize: none; outline: none; background: transparent; padding: 18px 22px 40vh; font-size: 18px; line-height: 1.6; tab-size: 2; }
.pad::placeholder { color: var(--faint); }
.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 8px 12px 10px; font-weight: 600; color: var(--faint); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; padding: 14px 18px 40px; min-height: 0; }
.pane-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 5px 6px; border-radius: 8px; }
.tl li.can { cursor: pointer; }
.tl li.can:hover { background: var(--hover); }
.tl time { font: 12px/1.9 var(--mono); color: var(--faint); }
.tl .mine { color: var(--mine); font-weight: 600; }
.tl .theirs { color: var(--theirs); }
.tl .live { color: var(--faint); font-style: italic; }
.hint { color: var(--faint); font-size: 14px; }

.md { font-size: 16px; }
.md h1, .md h2, .md h3 { letter-spacing: -.01em; margin: 1.2em 0 .4em; line-height: 1.25; }
.md h1 { font-size: 21px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md h1:first-child, .md h2:first-child { margin-top: 0; }
.md p, .md ul { margin: .4em 0; }
.md ul { padding-left: 1.2em; }
.md .ai { color: var(--theirs); }
.md mark { background: transparent; color: var(--mine); font-weight: 600; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; margin: .5em 0; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { color: var(--soft); font-weight: 600; }
.md code { font: 13px var(--mono); }

.ask { display: flex; gap: 8px; margin-top: 12px; }
.ask textarea { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); resize: vertical; min-height: 44px; font-size: 16px; }
.qa { border-bottom: 1px solid var(--line); padding: 10px 0; }
.qa .q { font-weight: 600; }

dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, 94vw); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg { padding: 20px 22px; }
.dlg h2 { margin: 0 0 12px; font-size: 19px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field span { font-size: 13px; font-weight: 600; color: var(--soft); }
.field small { color: var(--faint); font-size: 13px; }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 10px; font-size: 16px; }
.check { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 10; max-width: 90vw; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 300px; background: var(--bg); z-index: 5; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .app.list-open .side { transform: none; }
  .body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .right { border-left: 0; border-top: 1px solid var(--line); }
}
@media (min-width: 901px) { .only-narrow { display: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <h1>Meetings</h1>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="newBtn" title="New meeting (Command K)" aria-label="New meeting">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search notes and transcripts" autocomplete="off">
    <div class="list" id="list"></div>
    <div class="side-foot hint" id="syncState">Not synced yet</div>
  </aside>

  <main class="main" id="main">
    <div class="empty" id="empty">
      <h2>Type while it listens</h2>
      <p>Start a meeting, hit record, and type the few things worth typing. The iPad transcribes as you go, and Claude turns your notes and the transcript into the full record.</p>
      <p><button class="btn primary" id="emptyNew">New meeting<kbd>⌘K</kbd></button></p>
    </div>

    <section id="meeting" hidden style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="top">
        <div style="display:flex;gap:8px;align-items:center">
          <button class="icon-btn only-narrow" id="listBtn" aria-label="Meetings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <input class="title" id="title" placeholder="Untitled meeting" autocomplete="off">
        </div>
        <div class="meta">
          <select id="company" aria-label="Company"></select>
          <select id="template" aria-label="Meeting type"></select>
          <input id="people" placeholder="Who was there" autocomplete="off">
          <button class="rec-btn" id="recBtn" title="Record (Command J)"><span class="ring"></span><span id="recLabel">Record</span><span class="meter" id="meter"><i></i></span></button>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="body">
        <div class="pad-wrap">
          <textarea class="pad" id="pad" placeholder="Your notes. One thought per line. Keep it rough, Claude fills in the rest." spellcheck="true"></textarea>
        </div>
        <div class="right">
          <div class="tabs" role="tablist">
            <button class="tab on" data-tab="timeline" role="tab">Transcript</button>
            <button class="tab" data-tab="notes" role="tab">Notes</button>
            <button class="tab" data-tab="ask" role="tab">Ask</button>
          </div>
          <div class="pane" id="pane-timeline"></div>
          <div class="pane" id="pane-notes" hidden></div>
          <div class="pane" id="pane-ask" hidden></div>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="settings">
  <form class="dlg" method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label class="field"><span>Anthropic API key</span><input name="anthropicKey" type="password" autocomplete="off" placeholder="sk-ant-..."><small>Turns on Enhance and Ask. Kept on this iPad only.</small></label>
    <label class="field"><span>Claude model</span>
      <select name="model"><option value="claude-sonnet-5-5">Sonnet 5.5 (fast, the default)</option><option value="claude-opus-5-5">Opus 5.5 (deepest)</option></select></label>
    <label class="field"><span>GitHub token</span><input name="githubToken" type="password" autocomplete="off" placeholder="github_pat_..."><small>Sends each meeting into the Agentic OS repo so every Claude session can read it. Kept on this iPad only.</small></label>
    <label class="field"><span>Repository and branch</span><input name="repo" autocomplete="off"><small>owner/repo@branch</small></label>
    <label class="field"><span>Transcription model</span>
      <select name="whisper"><option value="onnx-community/whisper-base.en">Whisper base (about 200 MB, quick)</option><option value="onnx-community/whisper-small.en">Whisper small (about 590 MB, more accurate)</option></select></label>
    <label class="field"><span>Names and words to expect</span><textarea name="vocab" rows="3" style="border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:16px;resize:vertical"></textarea><small>Comma separated. Claude fixes transcript mishearings of these, and only these. Add the people you meet with.</small></label>
    <label class="check"><input type="checkbox" name="liveCaptions"><span>Live captions from Safari's own speech recognition, while Whisper catches up. Off if they fight over the microphone.</span></label>
    <label class="check"><input type="checkbox" name="deleteAudio"><span>Delete the audio once its transcript is done.</span></label>
    <div class="dlg-foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save" id="saveSettings">Save</button></div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
