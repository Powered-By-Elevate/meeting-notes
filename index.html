<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#f3f1fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070c" media="(prefers-color-scheme: dark)">
<title>Meeting Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.8/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.2.8/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.2.8/latin-400-italic.css">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --bg: #f3f1fb;
  --ink: #12131a; --soft: #474b5e; --faint: #6e7288;
  --glass: rgba(255,255,255,.58); --glass-2: rgba(255,255,255,.78); --glass-edge: rgba(255,255,255,.9);
  --hair: rgba(20,22,40,.09); --hover: rgba(108,76,255,.08);
  --grad: linear-gradient(120deg, #6d4cff 0%, #b04cff 45%, #0ea5e9 100%);
  --grad-soft: linear-gradient(120deg, rgba(109,76,255,.14), rgba(14,165,233,.14));
  --accent: #6d4cff; --accent-2: #0ea5e9; --on-accent: #ffffff;
  --rec: #e11d48; --rec-glow: rgba(225,29,72,.35);
  --ok: #059669; --warn: #b45309;
  --mine: #12131a; --theirs: #5d6178;
  --blob-1: #c4b5fd; --blob-2: #a5f3fc; --blob-3: #fbcfe8; --blob-4: #fde68a;
  --shadow: 0 1px 1px rgba(20,22,40,.04), 0 10px 40px -12px rgba(60,40,140,.22);
  --shadow-lift: 0 2px 2px rgba(20,22,40,.05), 0 22px 60px -18px rgba(60,40,140,.38);
  --r: 22px; --r-sm: 14px;
  --sans: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", "New York", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #06070c;
    --ink: #f3f4fb; --soft: #b4b8cc; --faint: #8186a0;
    --glass: rgba(20,22,36,.52); --glass-2: rgba(28,30,48,.72); --glass-edge: rgba(255,255,255,.10);
    --hair: rgba(255,255,255,.08); --hover: rgba(167,139,250,.10);
    --grad: linear-gradient(120deg, #8b5cf6 0%, #d946ef 45%, #22d3ee 100%);
    --grad-soft: linear-gradient(120deg, rgba(139,92,246,.20), rgba(34,211,238,.16));
    --accent: #a78bfa; --accent-2: #22d3ee; --on-accent: #ffffff;
    --rec: #ff4d6d; --rec-glow: rgba(255,77,109,.45);
    --ok: #34d399; --warn: #fbbf24;
    --mine: #ffffff; --theirs: #9ea3bd;
    --blob-1: #5b21b6; --blob-2: #0e7490; --blob-3: #9d174d; --blob-4: #1e3a8a;
    --shadow: 0 1px 1px rgba(0,0,0,.3), 0 18px 50px -16px rgba(0,0,0,.7);
    --shadow-lift: 0 2px 2px rgba(0,0,0,.3), 0 30px 70px -20px rgba(0,0,0,.85);
    color-scheme: dark;
  }
}

/* ---------------------------------------------------------------- the world behind */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: "cv11", "ss01"; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

.aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(70px) saturate(1.2); opacity: .9; }
.aurora i { position: absolute; border-radius: 50%; mix-blend-mode: normal; will-change: transform; }
.aurora i:nth-child(1) { width: 52vmax; height: 52vmax; left: 2%; top: 4%; background: var(--blob-1); animation: drift1 38s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 46vmax; height: 46vmax; right: 0; top: 18%; background: var(--blob-2); animation: drift2 44s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 40vmax; height: 40vmax; left: 28%; bottom: -6%; background: var(--blob-3); animation: drift3 50s ease-in-out infinite alternate; opacity: .8; }
.aurora i:nth-child(4) { width: 30vmax; height: 30vmax; right: 18%; bottom: 10%; background: var(--blob-4); animation: drift1 56s ease-in-out infinite alternate-reverse; opacity: .55; }
@keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.18) rotate(20deg); } }
@keyframes drift2 { to { transform: translate(-16vmax, 8vmax) scale(.86); } }
@keyframes drift3 { to { transform: translate(10vmax, -12vmax) scale(1.12); } }
body.listening .aurora { animation: breathe 3.2s var(--ease) infinite; }
@keyframes breathe { 50% { opacity: 1; filter: blur(60px) saturate(1.45); } }
.grain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ---------------------------------------------------------------- frame */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 300px 1fr; gap: 14px; height: 100dvh;
  padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
.glass { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6); }
.rise { animation: rise .7s var(--ease) both; }
.rise.d1 { animation-delay: .06s; } .rise.d2 { animation-delay: .12s; } .rise.d3 { animation-delay: .18s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(6px); } }

/* ---------------------------------------------------------------- sidebar */
.side { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px 18px; }
.orb { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 0deg, #8b5cf6, #22d3ee, #f472b6, #8b5cf6); animation: spin 9s linear infinite; position: relative; flex: none; box-shadow: 0 0 22px -2px color-mix(in srgb, var(--accent) 70%, transparent); }
.orb::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); opacity: .85; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand h1 { font: 400 italic 30px/1 var(--serif); margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn { border: 0; background: transparent; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--soft); transition: background .2s var(--ease), color .2s, transform .15s; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.plus { background: var(--grad); color: var(--on-accent); box-shadow: 0 6px 20px -6px color-mix(in srgb, var(--accent) 80%, transparent); }
.icon-btn.plus:hover { filter: brightness(1.08); color: var(--on-accent); }
.search-wrap { position: relative; margin: 4px 14px 8px; }
.search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search { width: 100%; padding: 11px 14px 11px 38px; border: 1px solid var(--hair); border-radius: 14px; background: var(--glass-2); font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
.search:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.list { overflow-y: auto; flex: 1; padding: 2px 10px 16px; scrollbar-width: none; }
.day { font-size: 11px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .14em; padding: 14px 8px 6px; }
.item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 11px 12px; border-radius: 14px; margin-bottom: 4px; transition: background .25s var(--ease), transform .25s var(--ease), border-color .25s; }
.item:hover { background: var(--hover); transform: translateX(2px); }
.item.on { background: var(--glass-2); border-color: transparent; box-shadow: var(--shadow); position: relative; }
.item.on::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--grad); }
.item b { display: block; font-weight: 600; font-size: 15px; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { color: var(--faint); font-size: 12.5px; display: flex; gap: 6px; align-items: center; margin-top: 2px; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.dot.rec { background: var(--rec); box-shadow: 0 0 0 0 var(--rec-glow); animation: ping 1.6s ease-out infinite; }
.dot.wait { background: var(--warn); }
.dot.ok { background: var(--ok); }
@keyframes ping { 70% { box-shadow: 0 0 0 7px transparent; } }
.side-foot { padding: 12px 18px calc(12px + env(safe-area-inset-bottom) * 0); border-top: 1px solid var(--hair); font-size: 12.5px; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.side-foot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.side-foot.good::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.hint { color: var(--faint); font-size: 14px; }

/* ---------------------------------------------------------------- empty state */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.empty { margin: auto; text-align: center; padding: 24px; max-width: 640px; }
.hero-orb { width: 168px; height: 168px; margin: 0 auto 28px; position: relative; }
.hero-orb i { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 90deg, #8b5cf6, #22d3ee, #f472b6, #fbbf24, #8b5cf6); filter: blur(18px); animation: spin 12s linear infinite; opacity: .85; }
.hero-orb b { position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 40%, transparent 70%), conic-gradient(from 200deg, #6d4cff, #0ea5e9, #ec4899, #6d4cff); box-shadow: inset 0 0 30px rgba(255,255,255,.35); animation: spin 18s linear infinite reverse; }
.hero-orb em { position: absolute; inset: 0; display: grid; place-items: center; gap: 0; }
.hero-orb .bars span { display: inline-block; width: 6px; margin: 0 3px; border-radius: 3px; background: #fff; animation: eq 1.2s var(--ease) infinite; box-shadow: 0 0 12px rgba(255,255,255,.8); }
.bars { display: flex; align-items: center; height: 44px; }
.bars span:nth-child(1) { height: 16px; animation-delay: -.2s; } .bars span:nth-child(2) { height: 34px; animation-delay: -.5s; }
.bars span:nth-child(3) { height: 44px; animation-delay: -.1s; } .bars span:nth-child(4) { height: 26px; animation-delay: -.7s; } .bars span:nth-child(5) { height: 14px; animation-delay: -.3s; }
@keyframes eq { 50% { transform: scaleY(.45); } }
.empty h2 { font: 400 clamp(46px, 6vw, 76px)/.98 var(--serif); letter-spacing: -.025em; margin: 0 0 18px; }
.empty h2 em { font-style: italic; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em; }
.empty p { color: var(--soft); font-size: 17px; line-height: 1.6; margin: 0 auto 28px; max-width: 480px; }
.keys { display: flex; justify-content: center; gap: 18px; margin-top: 26px; flex-wrap: wrap; color: var(--faint); font-size: 13px; }
.keys span { display: inline-flex; align-items: center; gap: 7px; }

/* ---------------------------------------------------------------- buttons and chips */
.btn { border: 1px solid var(--hair); background: var(--glass-2); border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: 15px; min-height: 42px; display: inline-flex; align-items: center; gap: 8px; transition: transform .2s var(--ease), box-shadow .25s var(--ease), filter .2s, background .2s; box-shadow: var(--shadow); }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
.btn:active { transform: translateY(0) scale(.97); }
.btn.primary { background: var(--grad); background-size: 160% 160%; color: var(--on-accent); border-color: transparent; box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--accent) 90%, transparent), inset 0 1px 0 rgba(255,255,255,.35); animation: sheen 6s ease-in-out infinite alternate; }
@keyframes sheen { to { background-position: 100% 50%; } }
.btn.big { min-height: 54px; padding: 12px 26px; font-size: 16.5px; }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
kbd { font: 600 11.5px var(--sans); color: inherit; opacity: .8; border: 1px solid currentColor; border-radius: 6px; padding: 1px 6px; margin-left: 2px; letter-spacing: .02em; }
.keys kbd { opacity: 1; color: var(--soft); border-color: var(--hair); background: var(--glass-2); padding: 2px 8px; }

/* ---------------------------------------------------------------- meeting head */
.top { padding: 18px 22px 14px; }
.title-row { display: flex; gap: 8px; align-items: center; }
.title { flex: 1; min-width: 0; border: 0; background: transparent; font: 400 clamp(34px, 3.6vw, 46px)/1.05 var(--serif); letter-spacing: -.02em; padding: 0; outline: none; }
.title::placeholder { color: var(--faint); font-style: italic; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.chip { position: relative; display: inline-flex; align-items: center; }
.meta select, .meta input { appearance: none; -webkit-appearance: none; border: 1px solid var(--hair); background: var(--glass-2); border-radius: 999px; padding: 8px 34px 8px 14px; font-size: 16px; min-height: 42px; outline: none; transition: border-color .2s, box-shadow .2s; max-width: 260px; }
.meta input { padding-right: 14px; min-width: 0; flex: 1 1 140px; max-width: none; }
.chip::after { content: ""; position: absolute; right: 14px; width: 7px; height: 7px; border-right: 1.6px solid var(--faint); border-bottom: 1.6px solid var(--faint); transform: translateY(-2px) rotate(45deg); pointer-events: none; }
.meta select:focus, .meta input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }

.rec-btn { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 6px 18px 6px 7px; font-weight: 650; font-size: 15px; min-height: 48px; flex: none;
  background: var(--glass-2); box-shadow: var(--shadow), inset 0 0 0 1px var(--hair); transition: transform .2s var(--ease), box-shadow .3s var(--ease), background .3s; font-variant-numeric: tabular-nums; }
.rec-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift), inset 0 0 0 1px var(--hair); }
.rec-btn:active { transform: scale(.97); }
.rec-btn .ring { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8fa3, var(--rec) 65%); box-shadow: 0 0 0 4px color-mix(in srgb, var(--rec) 16%, transparent), 0 6px 18px -4px var(--rec-glow); display: grid; place-items: center; transition: border-radius .3s var(--ease); }
.rec-btn .ring::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; transition: border-radius .3s var(--ease), transform .3s var(--ease); }
.rec-btn.on { background: linear-gradient(120deg, color-mix(in srgb, var(--rec) 92%, #000 0%), #ff6a3d); color: #fff; box-shadow: 0 0 0 0 var(--rec-glow), 0 14px 40px -10px var(--rec-glow); animation: glow 2s ease-in-out infinite; }
.rec-btn.on .ring { background: rgba(255,255,255,.22); box-shadow: none; }
.rec-btn.on .ring::after { border-radius: 3px; transform: scale(1.05); }
@keyframes glow { 50% { box-shadow: 0 0 0 8px transparent, 0 18px 50px -8px var(--rec-glow); } }
#wave { width: 92px; height: 26px; display: block; }
.status { font-size: 13px; color: var(--faint); margin-top: 10px; min-height: 20px; display: flex; align-items: center; gap: 8px; }
.status:not(:empty)::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
.status .warn { color: var(--warn); }

/* ---------------------------------------------------------------- body: notepad and panes */
.body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 42%); gap: 14px; min-height: 0; }
.pad-wrap { display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative; }
.pad-label { position: absolute; top: 16px; left: 24px; font-size: 11px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); pointer-events: none; }
.pad { flex: 1; border: 0; resize: none; outline: none; background: transparent; padding: 44px 24px 40vh; font: 400 19px/1.75 var(--sans); letter-spacing: -.003em; tab-size: 2; caret-color: var(--accent); }
.pad::placeholder { color: var(--faint); }
.right { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 2px; margin: 12px 12px 4px; padding: 4px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 6%, transparent); position: relative; }
.tab { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--faint); transition: color .2s, background .25s var(--ease), box-shadow .25s; }
.tab.on { color: var(--ink); background: var(--glass-2); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px -8px rgba(60,40,140,.35); }
.pane { flex: 1; overflow-y: auto; padding: 14px 20px 40px; min-height: 0; scrollbar-width: thin; }
.pane > * { animation: fadein .45s var(--ease) both; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
.pane-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

/* the timeline: your lines and the transcript on one clock */
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; position: relative; }
.tl::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: linear-gradient(var(--accent), var(--accent-2), transparent); opacity: .5; }
.tl li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 7px 10px; border-radius: 12px; position: relative; transition: background .2s; }
.tl li::before { content: ""; position: absolute; left: -14px; top: 15px; width: 8px; height: 8px; border-radius: 50%; background: var(--bg); border: 2px solid color-mix(in srgb, var(--theirs) 60%, transparent); }
.tl li.can { cursor: pointer; }
.tl li.can:hover { background: var(--hover); }
.tl time { font: 500 12px/1.9 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.tl li:has(.mine)::before { border: 0; background: var(--grad); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
.tl .mine { color: var(--mine); font-weight: 650; background: var(--grad-soft); border-radius: 10px; padding: 3px 10px; margin: -3px -10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tl .theirs { color: var(--theirs); }
.tl .live { color: var(--faint); font-style: italic; background: linear-gradient(90deg, var(--faint), var(--ink), var(--faint)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* the record Claude writes */
.md { font-size: 16px; line-height: 1.65; }
.md h1 { font: 400 32px/1.08 var(--serif); letter-spacing: -.02em; margin: 4px 0 18px; }
.md h2 { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
.md h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hair), transparent); }
.md h3 { font-size: 15px; margin: 18px 0 6px; }
.md p, .md ul { margin: .45em 0; }
.md ul { padding-left: 0; list-style: none; }
.md li { position: relative; padding-left: 20px; margin: 6px 0; }
.md li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); }
.md .ai { color: var(--theirs); }
.md mark { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--accent) 26%, transparent) 58%); color: var(--mine); font-weight: 650; padding: 0 1px; }
.md table { border-collapse: separate; border-spacing: 0 6px; width: 100%; font-size: 14px; margin: 4px 0; }
.md th { color: var(--faint); font-weight: 650; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-align: left; padding: 0 12px; }
.md td { background: var(--glass-2); padding: 10px 12px; vertical-align: top; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.md td:first-child { border-left: 1px solid var(--hair); border-radius: 12px 0 0 12px; font-weight: 650; color: var(--ink); }
.md td:last-child { border-right: 1px solid var(--hair); border-radius: 0 12px 12px 0; white-space: nowrap; color: var(--soft); }
.md code { font: 13px var(--mono); }
.writing { display: inline-flex; gap: 4px; margin-left: 4px; }
.writing i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: hop 1s var(--ease) infinite; }
.writing i:nth-child(2) { animation-delay: .15s; } .writing i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 40% { transform: translateY(-4px); opacity: .5; } }

.ask { display: flex; gap: 8px; margin-top: 14px; align-items: flex-end; }
.ask textarea { flex: 1; border: 1px solid var(--hair); border-radius: 16px; padding: 11px 14px; background: var(--glass-2); resize: none; min-height: 48px; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
.ask textarea:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.qa { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.qa .q { font: 400 22px/1.2 var(--serif); margin-bottom: 6px; }

/* ---------------------------------------------------------------- settings and toast */
dialog { border: 1px solid var(--glass-edge); border-radius: 26px; padding: 0; width: min(580px, 94vw); max-height: 88dvh; background: var(--glass-2); color: var(--ink); box-shadow: var(--shadow-lift);
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); }
dialog[open] { animation: pop .4s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
dialog::backdrop { background: rgba(8,8,20,.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.dlg { padding: 24px 26px; }
.dlg h2 { margin: 0 0 18px; font: 400 34px/1 var(--serif); letter-spacing: -.02em; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field span { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.field small { color: var(--faint); font-size: 13px; }
.field input, .field select, .field textarea { border: 1px solid var(--hair); background: var(--glass); border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; font-size: 14.5px; color: var(--soft); }
.check input { accent-color: var(--accent); width: 18px; height: 18px; margin-top: 2px; flex: none; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--glass-2); color: var(--ink); border: 1px solid var(--glass-edge); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 550; box-shadow: var(--shadow-lift); z-index: 10; max-width: 90vw;
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); animation: toast .5s var(--ease) both; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 10px auto 10px 10px; width: 300px; z-index: 5; transform: translateX(-112%); transition: transform .45s var(--ease); }
  .app.list-open .side { transform: none; }
  .body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (min-width: 901px) { .only-narrow { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="app" id="app">
  <aside class="side glass rise">
    <div class="brand">
      <span class="orb" aria-hidden="true"></span>
      <h1>Notes</h1>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
      <button class="icon-btn plus" id="newBtn" title="New meeting (Command K)" aria-label="New meeting">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search" id="search" type="search" placeholder="Search meetings" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot" id="syncState">Not synced yet</div>
  </aside>

  <main class="main" id="main">
    <div class="empty rise d1" id="empty">
      <div class="hero-orb" aria-hidden="true"><i></i><b></b><em><span class="bars"><span></span><span></span><span></span><span></span><span></span></span></em></div>
      <h2>Type while it <em>listens.</em></h2>
      <p>Hit record and jot the few things worth jotting. Your iPad transcribes as the meeting happens, and Claude turns it all into the record.</p>
      <button class="btn primary big" id="emptyNew">Start a meeting<kbd>⌘K</kbd></button>
      <div class="keys"><span><kbd>⌘J</kbd> record</span><span><kbd>⌘E</kbd> enhance</span><span><kbd>⌘K</kbd> new</span></div>
    </div>

    <section id="meeting" hidden style="display:flex;flex-direction:column;min-height:0;flex:1;gap:14px">
      <div class="top glass rise d1">
        <div class="title-row">
          <button class="icon-btn only-narrow" id="listBtn" aria-label="Meetings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
          </button>
          <input class="title" id="title" placeholder="Untitled meeting" autocomplete="off">
          <button class="rec-btn" id="recBtn" title="Record (Command J)"><span class="ring"></span><span id="recLabel">Record</span><canvas id="wave" width="184" height="52" hidden></canvas></button>
          <button class="icon-btn" id="delBtn" title="Delete this meeting" aria-label="Delete this meeting">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          </button>
        </div>
        <div class="meta">
          <label class="chip"><select id="company" aria-label="Company"></select></label>
          <label class="chip"><select id="template" aria-label="Meeting type"></select></label>
          <input id="people" placeholder="Who was there" autocomplete="off">
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="body">
        <div class="pad-wrap glass rise d2">
          <span class="pad-label">Your notes</span>
          <textarea class="pad" id="pad" placeholder="One thought per line. Keep it rough. Claude fills in the rest." spellcheck="true"></textarea>
        </div>
        <div class="right glass rise d3">
          <div class="tabs" role="tablist">
            <button class="tab on" data-tab="timeline" role="tab">Transcript</button>
            <button class="tab" data-tab="notes" role="tab">Notes</button>
            <button class="tab" data-tab="ask" role="tab">Ask</button>
          </div>
          <div class="pane" id="pane-timeline"></div>
          <div class="pane" id="pane-notes" hidden></div>
          <div class="pane" id="pane-ask" hidden></div>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="settings">
  <form class="dlg" method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label class="field"><span>Anthropic API key</span><input name="anthropicKey" type="password" autocomplete="off" placeholder="sk-ant-..."><small>Turns on Enhance and Ask. Kept on this iPad only.</small></label>
    <label class="field"><span>Claude model</span>
      <select name="model"><option value="claude-sonnet-5-5">Sonnet 5.5 (fast, the default)</option><option value="claude-opus-5-5">Opus 5.5 (deepest)</option></select></label>
    <label class="field"><span>GitHub token</span><input name="githubToken" type="password" autocomplete="off" placeholder="github_pat_..."><small>Sends each meeting into the Agentic OS repo so every Claude session can read it. Kept on this iPad only.</small></label>
    <label class="field"><span>Repository and branch</span><input name="repo" autocomplete="off"><small>owner/repo@branch</small></label>
    <label class="field"><span>Transcription model</span>
      <select name="whisper"><option value="onnx-community/whisper-base.en">Whisper base (about 200 MB, quick)</option><option value="onnx-community/whisper-small.en">Whisper small (about 590 MB, more accurate)</option></select></label>
    <label class="field"><span>Names and words to expect</span><textarea name="vocab" rows="3"></textarea><small>Comma separated. Claude fixes transcript mishearings of these, and only these. Add the people you meet with.</small></label>
    <label class="check"><input type="checkbox" name="liveCaptions"><span>Live captions from Safari's own speech recognition, while Whisper catches up. Off if they fight over the microphone.</span></label>
    <label class="check"><input type="checkbox" name="deleteAudio"><span>Delete the audio once its transcript is done.</span></label>
    <div class="dlg-foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save" id="saveSettings">Save</button></div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
