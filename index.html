<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Meeting Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.8/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/newsreader@5.2.10/opsz.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/newsreader@5.2.10/opsz-italic.css">
<style>
/* ---------------------------------------------------------------- tokens
   A notebook: warm paper on a desk, ink, one quiet accent. Newsreader for what you read and
   write, Inter for everything you press. */
:root {
  --paper: #fdfcfa; --desk: #f3f2ee; --rail: #efede8;
  --ink: #1a1a19; --soft: #55534e; --faint: #8a877f; --ghost: #b9b6ad;
  --hair: rgba(26,26,25,.09); --hover: rgba(26,26,25,.045); --press: rgba(26,26,25,.08);
  --accent: #3b5bdb; --mine-bg: rgba(59,91,219,.08); --mine-ink: #1a1a19;
  --solid: #1a1a19; --on-solid: #fdfcfa;
  --rec: #e03131; --ok: #2f9e44; --warn: #e8590c; --highlight: rgba(250, 204, 21, .42);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px -10px rgba(0,0,0,.12);
  --shadow-up: 0 2px 4px rgba(0,0,0,.05), 0 18px 50px -14px rgba(0,0,0,.22);
  --serif: "Newsreader Variable", "New York", Georgia, serif;
  --sans: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1a1a19; --desk: #121212; --rail: #0f0f0f;
    --ink: #ecebe7; --soft: #b4b2ab; --faint: #85837c; --ghost: #5a5853;
    --hair: rgba(236,235,231,.09); --hover: rgba(236,235,231,.05); --press: rgba(236,235,231,.09);
    --accent: #8ea2f2; --mine-bg: rgba(142,162,242,.14); --mine-ink: #f4f3ef;
    --solid: #ecebe7; --on-solid: #121212;
    --rec: #ff6b6b; --ok: #69db7c; --warn: #ffa94d; --highlight: rgba(250, 204, 21, .3);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.6);
    --shadow-up: 0 2px 4px rgba(0,0,0,.35), 0 24px 60px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--desk); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; font-feature-settings: "cv11", "ss01"; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
::selection { background: var(--mine-bg); }

/* ---------------------------------------------------------------- frame: rail, page, drawer */
.app { display: grid; grid-template-columns: 248px 1fr; height: 100dvh; padding-top: env(safe-area-inset-top); }
.side { background: var(--rail); border-right: 1px solid var(--hair); display: flex; flex-direction: column; min-height: 0; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--desk); }

/* ---------------------------------------------------------------- rail */
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 12px 12px 18px; }
.orb { width: 22px; height: 22px; border-radius: 7px; background: var(--solid); flex: none; display: grid; place-items: center; }
.orb::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); }
.brand h1 { font: 600 15px/1 var(--sans); letter-spacing: -.01em; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { gap: 6px; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--soft); transition: background .15s, color .15s, transform .12s; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { transform: scale(.93); background: var(--press); }
.icon-btn.on { color: var(--ink); background: var(--press); }
.icon-btn.plus { background: var(--solid); color: var(--on-solid); width: 32px; height: 32px; border-radius: 9px; }
.icon-btn.plus:hover { opacity: .85; }
.search-wrap { position: relative; margin: 0 12px 6px; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid transparent; border-radius: 10px; background: var(--hover); font-size: 16px; outline: none; transition: background .15s, border-color .15s; }
.search:focus { background: var(--paper); border-color: var(--hair); }
.search::placeholder { color: var(--faint); }
.list { overflow-y: auto; flex: 1; padding: 0 8px 16px; scrollbar-width: none; }
.day { font-size: 11.5px; font-weight: 600; color: var(--faint); padding: 16px 10px 4px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; margin-bottom: 1px; transition: background .15s; }
.item:hover { background: var(--hover); }
.item.on { background: var(--paper); box-shadow: var(--shadow); }
.item b { display: block; font-weight: 550; font-size: 14.5px; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { color: var(--faint); font-size: 12.5px; display: flex; gap: 6px; align-items: center; margin-top: 1px; font-variant-numeric: tabular-nums; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
.dot.rec { background: var(--rec); animation: blink 1.4s ease-in-out infinite; }
.dot.wait { background: var(--ghost); }
.dot.ok { background: var(--ok); }
@keyframes blink { 50% { opacity: .3; } }
.side-foot { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); font-size: 12.5px; color: var(--faint); display: flex; gap: 8px; align-items: center; }
.side-foot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ghost); flex: none; }
.side-foot.good::before { background: var(--ok); }
.hint { color: var(--faint); font-size: 14px; }

/* ---------------------------------------------------------------- empty state */
.empty { margin: auto; text-align: center; padding: 24px; max-width: 560px; animation: rise .6s var(--ease) both; }
.hero-orb { width: 72px; height: 72px; margin: 0 auto 28px; position: relative; }
.hero-orb b { position: absolute; inset: 0; border-radius: 20px; background: var(--solid); box-shadow: var(--shadow-up); }
.hero-orb em { position: absolute; inset: 0; display: grid; place-items: center; }
.hero-orb .bars { display: flex; align-items: center; height: 30px; }
.hero-orb .bars span { display: inline-block; width: 4px; margin: 0 2px; border-radius: 2px; background: var(--on-solid); animation: eq 1.2s var(--ease) infinite; }
.bars span:nth-child(1) { height: 10px; animation-delay: -.2s; } .bars span:nth-child(2) { height: 22px; animation-delay: -.5s; }
.bars span:nth-child(3) { height: 30px; animation-delay: -.1s; } .bars span:nth-child(4) { height: 18px; animation-delay: -.7s; } .bars span:nth-child(5) { height: 9px; animation-delay: -.3s; }
@keyframes eq { 50% { transform: scaleY(.45); } }
.empty h2 { font: 400 clamp(40px, 5vw, 56px)/1.04 var(--serif); font-variation-settings: "opsz" 72; letter-spacing: -.025em; margin: 0 0 14px; }
.empty h2 em { font-style: italic; color: var(--soft); }
.empty p { color: var(--soft); font: 400 18px/1.55 var(--serif); font-variation-settings: "opsz" 16; margin: 0 auto 28px; max-width: 420px; }
.keys { display: flex; justify-content: center; gap: 18px; margin-top: 22px; flex-wrap: wrap; color: var(--faint); font-size: 13px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* ---------------------------------------------------------------- buttons */
.btn { border: 1px solid var(--hair); background: var(--paper); border-radius: 10px; padding: 7px 14px; font-weight: 550; font-size: 14px; min-height: 38px; display: inline-flex; align-items: center; gap: 8px; transition: transform .12s, background .15s, box-shadow .2s; }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--solid); color: var(--on-solid); border-color: transparent; box-shadow: var(--shadow); }
.btn.primary:hover { opacity: .88; background: var(--solid); }
.btn.big { min-height: 48px; padding: 10px 22px; font-size: 15.5px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
kbd { font: 550 11px var(--sans); opacity: .65; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; }
.keys kbd { opacity: 1; color: var(--soft); border-color: var(--hair); background: var(--paper); padding: 1px 7px; }

/* ---------------------------------------------------------------- the meeting */
.meeting { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 10px 14px 10px 18px; min-height: 58px; }
.toolbar .spacer { flex: 1; }
.views { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--hover); gap: 2px; }
.view { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 550; font-size: 13.5px; color: var(--faint); transition: color .15s, background .2s var(--ease), box-shadow .2s; display: inline-flex; gap: 6px; align-items: center; }
.view.on { color: var(--ink); background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.view .spark { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
.view.has .spark { display: inline-block; }

.rec-btn { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--hair); border-radius: 999px; padding: 4px 14px 4px 5px; font-weight: 600; font-size: 13.5px; min-height: 38px; background: var(--paper); box-shadow: var(--shadow); transition: transform .12s, background .2s, color .2s; font-variant-numeric: tabular-nums; flex: none; }
.rec-btn:active { transform: scale(.97); }
.rec-btn .ring { width: 28px; height: 28px; border-radius: 50%; background: var(--rec); display: grid; place-items: center; }
.rec-btn .ring::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; transition: border-radius .25s var(--ease); }
.rec-btn.on { background: var(--rec); color: #fff; border-color: transparent; }
.rec-btn.on .ring { background: rgba(255,255,255,.2); }
.rec-btn.on .ring::after { border-radius: 2px; }
.rec-btn:disabled { opacity: .5; }
#wave { width: 76px; height: 22px; display: block; }

.stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.stage.closed { grid-template-columns: minmax(0, 1fr) 0; }
.sheet { container-type: inline-size; background: var(--paper); border-radius: 16px 16px 0 0; margin: 0 10px; box-shadow: var(--shadow); overflow-y: auto; min-height: 0; animation: rise .5s var(--ease) both; }
.page { max-width: 760px; margin: 0 auto; padding: 44px clamp(22px, 7cqi, 64px) 30vh; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; color: var(--faint); font-size: 13px; margin: 0 0 10px -6px; }
.eyebrow .sep { color: var(--ghost); padding: 0 2px; }
.eyebrow #when { padding: 0 6px; }
.eyebrow select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--soft); font-weight: 550; font-size: 16px; padding: 4px 6px; border-radius: 7px; cursor: pointer; outline: none; max-width: 100%; text-overflow: ellipsis; }
.eyebrow select:hover, .eyebrow select:focus { background: var(--hover); color: var(--ink); }
.title { display: block; width: 100%; border: 0; background: transparent; resize: none; overflow: hidden; font: 500 clamp(34px, 3.4vw, 44px)/1.1 var(--serif); font-variation-settings: "opsz" 72; letter-spacing: -.022em; padding: 0; outline: none; }
.title::placeholder { color: var(--ghost); }
.with { display: flex; align-items: baseline; gap: 6px; margin: 8px 0 4px; color: var(--faint); font: 400 italic 17px/1.4 var(--serif); }
.with input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font: 400 17px/1.4 var(--serif); color: var(--soft); padding: 2px 0; }
.with input::placeholder { color: var(--ghost); font-style: italic; }
.status { font-size: 13px; color: var(--faint); min-height: 20px; display: flex; align-items: center; gap: 8px; margin: 6px 0 0; }
.status:not(:empty)::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }
.status .warn { color: var(--warn); }
.rule { height: 1px; background: var(--hair); margin: 22px 0 24px; }
.pad { display: block; width: 100%; min-height: 40vh; overflow: hidden; border: 0; resize: none; outline: none; background: transparent; padding: 0; font: 400 19px/1.72 var(--serif); font-variation-settings: "opsz" 16; letter-spacing: -.002em; caret-color: var(--accent); field-sizing: content; }
.pad::placeholder { color: var(--ghost); font-style: italic; }

/* ---------------------------------------------------------------- the Pencil */
.write { position: relative; }
.write canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.write.armed { cursor: crosshair; }
.write.armed .pad { pointer-events: none; }
.tools { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding: 3px; border-radius: 11px; }
.tools.armed { background: var(--hover); }
.tool { border: 0; background: transparent; width: 34px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); transition: background .15s, color .15s, transform .12s; }
.tool:hover { color: var(--ink); }
.tool:active { transform: scale(.92); }
.tool.sel { color: var(--ink); }
.tools.armed .tool.sel, .tools.pen .tool.sel { background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tool .swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--hair); }
.tool .swatch.blue { background: var(--accent); } .tool .swatch.red { background: var(--rec); }
.tl .ink { display: block; }
.tl .ink img { display: block; max-width: 100%; max-height: 64px; box-shadow: inset 2px 0 0 var(--accent); padding-left: 10px; margin-left: -10px; }

/* ---------------------------------------------------------------- the drawer: transcript and ask */
.drawer { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding-right: 10px; }
.stage.closed .drawer { visibility: hidden; }
.tabs { display: flex; gap: 2px; margin: 0 0 8px; padding: 3px; border-radius: 11px; background: var(--hover); }
.tab { flex: 1; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-weight: 550; font-size: 13.5px; color: var(--faint); transition: color .15s, background .2s var(--ease), box-shadow .2s; }
.tab.on { color: var(--ink); background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.drawer .pane { background: var(--paper); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); }
.pane { flex: 1; overflow-y: auto; padding: 18px 20px 40px; min-height: 0; scrollbar-width: thin; }
.pane > * { animation: fadein .35s var(--ease) both; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
.pane-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 30px; align-items: center; }
.pane-actions .btn:not(.primary) { border-color: transparent; background: transparent; color: var(--soft); padding: 7px 10px; }
.pane-actions .btn:not(.primary):hover { background: var(--hover); color: var(--ink); }
.pane-actions .btn.primary { margin-right: 6px; }
#pane-notes { padding: 0; overflow: visible; }

/* the transcript: your lines and theirs on one clock */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 42px 1fr; gap: 8px; padding: 6px 8px; border-radius: 9px; transition: background .15s; font-size: 14.5px; line-height: 1.5; }
.tl li.can { cursor: pointer; }
.tl li.can:hover { background: var(--hover); }
.tl time { font: 500 11.5px/1.95 var(--mono); color: var(--ghost); font-variant-numeric: tabular-nums; }
.tl .mine { color: var(--mine-ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); padding-left: 10px; margin-left: -10px; }
.tl .theirs { color: var(--soft); }
.tl .live { color: var(--faint); font-style: italic; }

/* the record Claude writes, set as the page */
.md { font: 400 18.5px/1.7 var(--serif); font-variation-settings: "opsz" 16; }
.md h1 { font: 500 30px/1.15 var(--serif); font-variation-settings: "opsz" 60; letter-spacing: -.02em; margin: 0 0 18px; }
.md h2 { font: 600 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 30px 0 12px; }
.md h3 { font: 600 15px var(--sans); margin: 18px 0 6px; }
.md p, .md ul { margin: .4em 0; }
.md ul { padding-left: 0; list-style: none; }
.md li { position: relative; padding-left: 20px; margin: 5px 0; }
.md li::before { content: ""; position: absolute; left: 4px; top: .78em; width: 5px; height: 5px; border-radius: 50%; background: var(--ghost); }
.md .ai { color: var(--soft); }
.md mark { background: var(--mine-bg); color: var(--mine-ink); font-weight: 600; padding: 1px 3px; border-radius: 4px; }
.md table { border-collapse: collapse; width: 100%; font: 400 15px/1.45 var(--sans); margin: 4px 0; }
.md th { color: var(--faint); font-weight: 550; font-size: 12px; text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--hair); }
.md td { padding: 10px 10px 10px 0; vertical-align: top; border-bottom: 1px solid var(--hair); }
.md td:first-child { font-weight: 600; color: var(--ink); white-space: nowrap; }
.md td:last-child { color: var(--soft); white-space: nowrap; }
.md code { font: 13px var(--mono); }
.drawer .md { font: 400 15.5px/1.6 var(--sans); }
.writing { display: inline-flex; gap: 3px; margin-left: 4px; }
.writing i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: hop 1s var(--ease) infinite; }
.writing i:nth-child(2) { animation-delay: .15s; } .writing i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 40% { transform: translateY(-3px); opacity: .5; } }

.ask { display: flex; gap: 8px; margin-top: 14px; align-items: flex-end; }
.ask textarea { flex: 1; border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; background: var(--desk); resize: none; min-height: 46px; font-size: 16px; outline: none; }
.ask textarea:focus { border-color: var(--accent); }
.qa { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.qa .q { font: 500 18px/1.3 var(--serif); margin-bottom: 4px; }

/* ---------------------------------------------------------------- settings and toast */
dialog { border: 1px solid var(--hair); border-radius: 18px; padding: 0; width: min(560px, 94vw); max-height: 88dvh; background: var(--paper); color: var(--ink); box-shadow: var(--shadow-up); }
dialog[open] { animation: pop .3s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
dialog::backdrop { background: rgba(0,0,0,.28); }
.dlg { padding: 22px 24px; }
.dlg h2 { margin: 0 0 16px; font: 500 28px/1 var(--serif); font-variation-settings: "opsz" 60; letter-spacing: -.02em; }
.field { display: grid; gap: 5px; margin-bottom: 14px; }
.field span { font-size: 13px; font-weight: 600; color: var(--soft); }
.field small { color: var(--faint); font-size: 12.5px; }
.field input, .field select, .field textarea { border: 1px solid var(--hair); background: var(--desk); border-radius: 10px; padding: 9px 11px; font-size: 16px; outline: none; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; font-size: 14px; color: var(--soft); }
.check input { accent-color: var(--accent); width: 18px; height: 18px; margin-top: 1px; flex: none; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--solid); color: var(--on-solid); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-up); z-index: 10; max-width: 90vw; animation: toast .35s var(--ease) both; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 10px); } }

/* ---------------------------------------------------------------- narrower screens */
@media (max-width: 1100px) {
  .stage, .stage.closed { grid-template-columns: minmax(0, 1fr) 0; }
  .drawer { position: fixed; top: calc(58px + env(safe-area-inset-top)); right: 0; bottom: 0; width: min(380px, 92vw); z-index: 4; padding: 0 10px; background: var(--desk); box-shadow: var(--shadow-up); transform: translateX(105%); transition: transform .35s var(--ease); visibility: visible !important; }
  .stage:not(.closed) .drawer { transform: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 5; transform: translateX(-102%); transition: transform .35s var(--ease); box-shadow: var(--shadow-up); }
  .app.list-open .side { transform: none; }
}
@media (min-width: 861px) { .only-narrow { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <span class="orb" aria-hidden="true"></span>
      <h1>Meeting Notes</h1>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
      <button class="icon-btn plus" id="newBtn" title="New meeting (Command K)" aria-label="New meeting">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search" id="search" type="search" placeholder="Search meetings" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot" id="syncState">Not synced yet</div>
  </aside>

  <main class="main" id="main">
    <div class="empty" id="empty">
      <div class="hero-orb" aria-hidden="true"><b></b><em><span class="bars"><span></span><span></span><span></span><span></span><span></span></span></em></div>
      <h2>Type while it <em>listens.</em></h2>
      <p>Hit record and jot the few things worth jotting. Your iPad transcribes as the meeting happens, and Claude turns it all into the record.</p>
      <button class="btn primary big" id="emptyNew">Start a meeting<kbd>⌘K</kbd></button>
      <div class="keys"><span><kbd>⌘J</kbd> record</span><span><kbd>⌘E</kbd> enhance</span><span><kbd>⌘K</kbd> new</span></div>
    </div>

    <section id="meeting" class="meeting" hidden>
      <header class="toolbar">
        <button class="icon-btn only-narrow" id="listBtn" aria-label="Meetings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
        </button>
        <div class="views" role="tablist">
          <button class="view on" data-view="pad" role="tab">My notes</button>
          <button class="view" data-view="notes" role="tab"><span class="spark"></span>Claude's notes</button>
        </div>
        <div class="tools" id="tools" aria-label="Pencil">
          <button class="tool sel" data-tool="pen" title="Pen" aria-label="Pen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.8L16.5 3.9a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg></button>
          <button class="tool" data-tool="highlight" title="Highlighter" aria-label="Highlighter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 4v2h6l2-2"/><path d="M9 14l7.5-9.5a2 2 0 0 1 2.9-.2l.3.3a2 2 0 0 1-.2 2.9L10 15z"/><path d="M14 21h6"/></svg></button>
          <button class="tool" data-tool="erase" title="Eraser" aria-label="Eraser"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M5.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 19H8.5z"/><path d="M9.5 11.5l5 5"/></svg></button>
          <button class="tool" id="inkColor" title="Ink colour" aria-label="Ink colour"><span class="swatch"></span></button>
          <button class="tool" id="inkUndo" title="Undo ink" aria-label="Undo ink"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        </div>
        <span class="spacer"></span>
        <button class="rec-btn" id="recBtn" title="Record (Command J)"><span class="ring"></span><span id="recLabel">Record</span><canvas id="wave" width="152" height="44" hidden></canvas></button>
        <button class="icon-btn on" id="drawerBtn" title="Transcript and Ask" aria-label="Transcript and Ask">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
        </button>
        <button class="icon-btn" id="delBtn" title="Delete this meeting" aria-label="Delete this meeting">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </header>
      <div class="stage" id="stage">
        <div class="sheet">
          <article class="page">
            <div class="eyebrow">
              <select id="company" aria-label="Company"></select><span class="sep">·</span>
              <select id="template" aria-label="Meeting type"></select><span class="sep">·</span>
              <span id="when"></span>
            </div>
            <textarea class="title" id="title" rows="1" placeholder="Untitled meeting" spellcheck="false"></textarea>
            <div class="with">with <input id="people" placeholder="who was there" autocomplete="off"></div>
            <div class="status" id="status"></div>
            <div class="rule"></div>
            <div class="write" id="write">
              <textarea class="pad" id="pad" placeholder="Type, or write anywhere on the page with the Pencil." spellcheck="true"></textarea>
              <canvas class="ink-base" id="inkBase"></canvas><canvas class="ink-live" id="inkLive"></canvas>
            </div>
            <div class="pane" id="pane-notes" hidden></div>
          </article>
        </div>
        <aside class="drawer" id="drawer">
          <div class="tabs" role="tablist">
            <button class="tab on" data-tab="timeline" role="tab">Transcript</button>
            <button class="tab" data-tab="ask" role="tab">Ask</button>
          </div>
          <div class="pane" id="pane-timeline"></div>
          <div class="pane" id="pane-ask" hidden></div>
        </aside>
      </div>
    </section>
  </main>
</div>

<dialog id="settings">
  <form class="dlg" method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <label class="field"><span>Anthropic API key</span><input name="anthropicKey" type="password" autocomplete="off" placeholder="sk-ant-..."><small>Turns on Enhance and Ask. Kept on this iPad only.</small></label>
    <label class="field"><span>Claude model</span>
      <select name="model"><option value="claude-sonnet-5-5">Sonnet 5.5 (fast, the default)</option><option value="claude-opus-5-5">Opus 5.5 (deepest)</option></select></label>
    <label class="field"><span>GitHub token</span><input name="githubToken" type="password" autocomplete="off" placeholder="github_pat_..."><small>Sends each meeting into the Agentic OS repo so every Claude session can read it. Kept on this iPad only.</small></label>
    <label class="field"><span>Repository and branch</span><input name="repo" autocomplete="off"><small>owner/repo@branch</small></label>
    <label class="field"><span>Transcription model</span>
      <select name="whisper"><option value="onnx-community/whisper-base.en">Whisper base (about 200 MB, quick)</option><option value="onnx-community/whisper-small.en">Whisper small (about 590 MB, more accurate)</option></select></label>
    <label class="field"><span>Names and words to expect</span><textarea name="vocab" rows="3"></textarea><small>Comma separated. Claude fixes transcript mishearings of these, and only these. Add the people you meet with.</small></label>
    <label class="field"><span>Apple Pencil</span>
      <select name="pencil"><option value="ink">Writes ink on the page (Claude reads it)</option><option value="scribble">Turns handwriting into typed text (Apple's Scribble)</option></select></label>
    <label class="check"><input type="checkbox" name="liveCaptions"><span>Live captions from Safari's own speech recognition, while Whisper catches up. Off if they fight over the microphone.</span></label>
    <label class="check"><input type="checkbox" name="deleteAudio"><span>Delete the audio once its transcript is done.</span></label>
    <div class="dlg-foot"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="save" id="saveSettings">Save</button></div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
